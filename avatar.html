<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>アバターメーカー — HOTEL ELDIA</title>
<style>
:root{
  --font:'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif;
  --bg:#E1E6EC; --surf:#FFFFFF; --surf2:#F6F8FA;
  --line:#D3DAE2; --line-soft:#E6EAEF;
  --ink:#1B2631; --ink-2:#3D4A57; --muted:#667382;
  --pri:#1F5E8A; --pri-hover:#184C70; --pri-soft:#E3EEF6; --danger:#C23B2A;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
button,input{font-family:inherit}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar h1{font-size:16px;margin:0;font-weight:700}
.bar a{margin-left:auto;font-size:13px;color:var(--pri);text-decoration:none;font-weight:700}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:64px}
.preview{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--surf2);border:1px solid var(--line-soft);touch-action:none}
.preview svg{display:block;width:100%;height:100%}
.name{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surf2);text-align:center}
.name:focus{outline:none;border-color:var(--pri)}
.row{display:flex;gap:8px}
.row > *{flex:1}
.btn{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surf2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hover)}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin:0 0 8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.g-item{position:relative;cursor:pointer;text-align:center;font-size:11px;color:var(--ink-2)}
.g-item .thumb{border-radius:50%;overflow:hidden;border:2px solid transparent;aspect-ratio:1;background:var(--surf2)}
.g-item.on .thumb{border-color:var(--pri)}
.g-item .thumb svg{display:block;width:100%;height:100%}
.g-item .nm{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-item .del{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--danger);font-size:12px;line-height:1;cursor:pointer;display:none}
.g-item:hover .del{display:block}
.empty{grid-column:1/-1;font-size:12px;color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--pri)}
.sw.none{background:repeating-linear-gradient(45deg,#fff 0 5px,#e5e8ec 5px 10px)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.opt{border:2px solid var(--line-soft);border-radius:12px;background:var(--surf2);cursor:pointer;padding:0;overflow:hidden;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--line)}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt svg{display:block;width:100%;aspect-ratio:1}
.opt .lb{font-size:12px;font-weight:700;color:var(--ink-2);padding:4px 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* 生きている感じの動き（プレビューのみ） */
.live .av-head{transform-box:view-box;transform-origin:200px 330px;transform:rotate(var(--tilt,0deg));transition:transform .25s ease-out}
.live .av-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.live .av-iris{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .15s ease-out}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

@media (max-width:760px){
  .layout{grid-template-columns:1fr;padding:12px}
  .stage{position:static}
  .preview{width:min(260px,70vw);margin:0 auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
}
</style>
</head>
<body>
<header class="bar">
  <h1>アバターメーカー</h1>
  <a href="/">← シフト表へ</a>
</header>
<main class="layout">
  <section class="stage">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="preview live" id="preview"></div>
      <input class="name" id="name" placeholder="名前（例：山田）" maxlength="20">
      <div class="row">
        <button class="btn" id="undo" title="元に戻す">↶ 戻す</button>
        <button class="btn" id="redo" title="やり直す">↷ 進む</button>
        <button class="btn" id="random">🎲 おまかせ</button>
      </div>
      <div class="row">
        <button class="btn pri" id="save">保存</button>
        <button class="btn" id="new">新規</button>
      </div>
      <div class="row">
        <button class="btn" id="png">画像(PNG)</button>
        <button class="btn" id="svg">画像(SVG)</button>
      </div>
    </div>
    <div class="card">
      <p class="sec-title">保存したアバター</p>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>
  <section class="editor">
    <nav class="tabs" id="tabs"></nav>
    <div class="card" id="panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="swatches" id="colors"></div>
      <div class="toggles" id="toggles"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // ---------- 色ユーティリティ ----------
  function hexToRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function rgbToHex(c) { return "#" + c.map(function (v) { return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0"); }).join(""); }
  // amt > 0 で明るく、< 0 で暗く
  function shade(hex, amt) {
    var c = hexToRgb(hex), t = amt > 0 ? 255 : 0, p = Math.abs(amt);
    return rgbToHex(c.map(function (v) { return v + (t - v) * p; }));
  }

  // ---------- パーツ定義 ----------
  var SKINS = ["#FFE6D2", "#F6CBA6", "#EDBA92", "#E0A67C", "#C98C5E", "#A86D45", "#7D4B2C", "#57331F", "#BFE3F7", "#D9C8F5"];
  var HAIR_COLORS = ["#1C1714", "#3B2A20", "#6B4A2F", "#A0703F", "#D9B26A", "#ECDDB4", "#A63A22", "#8E8E8E", "#F2F2F2", "#E8669F", "#4A7BD8", "#7A4FD0", "#3FA37A"];
  var EYE_COLORS = ["#3B2618", "#6B4423", "#8A6A2B", "#2F6FA8", "#3C8A5A", "#6F7782", "#8E3FA6"];
  var LIP_COLORS = ["#C9535E", "#B5524A", "#E07A8C", "#C2253A", "#9C3D5E", "#8A5240"];
  var GLASSES_COLORS = ["#222222", "#7A4B2A", "#C9A227", "#C23B2A", "#1F5E8A", "#E8669F", "#BBBBBB"];
  var HAT_COLORS = ["#1F5E8A", "#C23B2A", "#2D7A52", "#F2B233", "#222222", "#F2F2F2", "#E8669F", "#7A4FD0"];
  var CLOTHES_COLORS = ["#1F5E8A", "#2B3440", "#F2F2F2", "#C23B2A", "#2D7A52", "#F2B233", "#E8669F", "#7A4FD0", "#8A6A4B", "#4FB0C6"];
  var BG_COLORS = ["#CFE3F2", "#FAD9DF", "#FBE8B8", "#D4EDD9", "#E2D9F5", "#F5E0CC", "#DDE2E8", "#2B3440", "transparent"];

  var FACES = {
    round:  { label: "まる",     w: 112, top: 66, chin: 302, jaw: 0.66, k: 0.68 },
    oval:   { label: "たまご",   w: 104, top: 62, chin: 306, jaw: 0.58, k: 0.66 },
    square: { label: "しかく",   w: 110, top: 66, chin: 300, jaw: 0.84, k: 0.78 },
    heart:  { label: "シャープ", w: 108, top: 66, chin: 306, jaw: 0.38, k: 0.56 },
    wide:   { label: "ふっくら", w: 120, top: 70, chin: 298, jaw: 0.74, k: 0.70 }
  };
  var SY = 185;   // 頭のいちばん幅が広い高さ
  var EX = 44;    // 目の左右の間隔
  var EY = 210;   // 目の高さ（低めに置くと幼く可愛く見える）
  var NY = 243;   // 鼻の高さ
  var MY = 268;   // 口の高さ

  function headPath(f) {
    var w = f.w, t = f.top, c = f.chin, j = w * f.jaw, ky = SY - (SY - t) * 0.552, by = SY + (c - SY) * f.k;
    return "M200 " + t +
      "C" + (200 + w * 0.552) + " " + t + " " + (200 + w) + " " + ky + " " + (200 + w) + " " + SY +
      "C" + (200 + w) + " " + by + " " + (200 + j) + " " + c + " 200 " + c +
      "C" + (200 - j) + " " + c + " " + (200 - w) + " " + by + " " + (200 - w) + " " + SY +
      "C" + (200 - w) + " " + ky + " " + (200 - w * 0.552) + " " + t + " 200 " + t + "Z";
  }

  // 円を path で（複数を1つの塗りにまとめるため）
  function circ(cx, cy, r) { return "M" + (cx - r) + " " + cy + "a" + r + " " + r + " 0 1 1 " + 2 * r + " 0a" + r + " " + r + " 0 1 1 " + -2 * r + " 0Z"; }

  // 頭頂をおおう髪の外形（左のこめかみ → 頭頂 → 右のこめかみ）
  function capTop(f, p) { return "M" + (200 - f.w - p) + " " + SY + "A" + (f.w + p) + " " + (SY - f.top + p) + " 0 0 1 " + (200 + f.w + p) + " " + SY; }
  // 生えぎわ：右のもみあげ → 額 → 左のもみあげ
  function hairline(f, p, sb, hy) {
    var w = f.w;
    return "L" + (200 + w + p) + " " + sb + "L" + (200 + w - 8) + " " + sb +
      "C" + (200 + w - 10) + " " + (hy + 22) + " " + (200 + w * 0.5) + " " + hy + " 200 " + hy +
      "C" + (200 - w * 0.5) + " " + hy + " " + (200 - w + 10) + " " + (hy + 22) + " " + (200 - w + 8) + " " + sb +
      "L" + (200 - w - p) + " " + sb + "Z";
  }
  // ぱっつん前髪（ギザギザ）
  function bangsLine(f, p, sb, y) {
    var w = f.w, s = "L" + (200 + w + p) + " " + sb + "L" + (200 + w - 6) + " " + sb +
      "C" + (200 + w - 6) + " " + (y + 18) + " " + (200 + w * 0.8) + " " + y + " " + (200 + w * 0.62) + " " + y;
    var n = 6, x0 = 200 + w * 0.62, x1 = 200 - w * 0.62, i;
    for (i = 1; i <= n; i++) {
      var x = x0 + (x1 - x0) * i / n, xm = x0 + (x1 - x0) * (i - 0.5) / n;
      s += "Q" + xm + " " + (y + 9) + " " + x + " " + y;
    }
    return s + "C" + (200 - w * 0.8) + " " + y + " " + (200 - w + 6) + " " + (y + 18) + " " + (200 - w + 6) + " " + sb +
      "L" + (200 - w - p) + " " + sb + "Z";
  }
  // 後ろ髪：頭頂からつながり、下端は丸く
  function backHair(f, p, bottom) {
    var w = f.w;
    return capTop(f, p) + "C" + (200 + w + p + 12) + " " + (SY + (bottom - SY) * 0.5) + " " + (200 + w + p + 14) + " " + (bottom - 30) + " " + (200 + w + p - 4) + " " + (bottom - 6) +
      "Q200 " + (bottom + 8) + " " + (200 - w - p + 4) + " " + (bottom - 6) +
      "C" + (200 - w - p - 14) + " " + (bottom - 30) + " " + (200 - w - p - 12) + " " + (SY + (bottom - SY) * 0.5) + " " + (200 - w - p) + " " + SY + "Z";
  }
  // 顔の横に垂れる髪
  function sideLocks(f, p, bottom) {
    var w = f.w;
    var r = "M" + (200 + w - 14) + " 170L" + (200 + w + p) + " 170L" + (200 + w + p) + " " + (bottom - 14) +
      "Q" + (200 + w + p) + " " + bottom + " " + (200 + w + p - 12) + " " + bottom + "Q" + (200 + w - 16) + " " + (bottom - 6) + " " + (200 + w - 16) + " " + (bottom - 30) + "Z";
    var l = "M" + (200 - w + 14) + " 170L" + (200 - w - p) + " 170L" + (200 - w - p) + " " + (bottom - 14) +
      "Q" + (200 - w - p) + " " + bottom + " " + (200 - w - p + 12) + " " + bottom + "Q" + (200 - w + 16) + " " + (bottom - 6) + " " + (200 - w + 16) + " " + (bottom - 30) + "Z";
    return r + l;
  }

  var HAIRS = {
    none:   { label: "なし", make: function () { return {}; } },
    buzz:   { label: "ぼうず", make: function (f) { return { front: capTop(f, 2) + hairline(f, 2, 192, 116), soft: true }; } },
    short:  { label: "ショート", make: function (f) { return { front: capTop(f, 12) + hairline(f, 12, 200, 122) }; } },
    side:   { label: "サイド分け", make: function (f) {
      var w = f.w, p = 12;
      return { front: capTop(f, p) + "L" + (200 + w + p) + " 200L" + (200 + w - 8) + " 200" +
        "C" + (200 + w - 4) + " 150 " + (200 + w * 0.45) + " 152 " + (200 + w * 0.05) + " 138" +
        "C" + (200 - w * 0.25) + " 128 " + (200 - w * 0.4) + " 108 " + (200 - w * 0.42) + " 100" +
        "C" + (200 - w * 0.6) + " 118 " + (200 - w + 6) + " 140 " + (200 - w + 8) + " 200L" + (200 - w - p) + " 200Z" };
    } },
    spiky:  { label: "ツンツン", make: function (f) {
      var w = f.w, ry = SY - f.top, n = 13, s = "", i;
      for (i = 0; i <= n; i++) {
        var a = Math.PI - Math.PI * i / n, r = i % 2 ? 30 : 6;
        var x = 200 + (w + r) * Math.cos(a), y = SY - (ry + r) * Math.sin(a);
        s += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }
      return { front: s + hairline(f, 6, 196, 124) };
    } },
    bangs:  { label: "ぱっつん", make: function (f) {
      return { back: backHair(f, 14, 292), front: capTop(f, 14) + bangsLine(f, 14, 200, 150), locks: sideLocks(f, 14, 284), coverEars: true };
    } },
    long:   { label: "ロング", make: function (f) {
      var w = f.w;
      return { back: backHair(f, 16, 356),
        front: capTop(f, 14) + "L" + (200 + w + 14) + " 200L" + (200 + w - 12) + " 200C" + (200 + w - 16) + " 140 " + (200 + w * 0.35) + " 118 200 " + (f.top + 34) +
          "C" + (200 - w * 0.35) + " 118 " + (200 - w + 16) + " 140 " + (200 - w + 12) + " 200L" + (200 - w - 14) + " 200Z", locks: sideLocks(f, 16, 330), coverEars: true };
    } },
    bun:    { label: "おだんご", make: function (f) { return { front: circ(200, f.top - 18, 36) + capTop(f, 6) + hairline(f, 6, 196, 118) }; } },
    twin:   { label: "ツイン", make: function (f) {
      var w = f.w;
      return { back: "M" + (200 + w) + " 150C" + (200 + w + 70) + " 170 " + (200 + w + 60) + " 300 " + (200 + w + 30) + " 320C" + (200 + w + 30) + " 260 " + (200 + w + 10) + " 200 " + (200 + w - 10) + " 180Z" +
                     "M" + (200 - w) + " 150C" + (200 - w - 70) + " 170 " + (200 - w - 60) + " 300 " + (200 - w - 30) + " 320C" + (200 - w - 30) + " 260 " + (200 - w - 10) + " 200 " + (200 - w + 10) + " 180Z",
        front: capTop(f, 10) + bangsLine(f, 10, 196, 146),
        ties: [[200 + w + 8, 156], [200 - w - 8, 156]] };
    } },
    pony:   { label: "ポニー", make: function (f) {
      var w = f.w;
      return { back: "M" + (200 + w - 20) + " 110C" + (200 + w + 60) + " 110 " + (200 + w + 70) + " 230 " + (200 + w + 34) + " 290C" + (200 + w + 40) + " 220 " + (200 + w + 10) + " 170 " + (200 + w - 30) + " 150Z",
        front: capTop(f, 8) + hairline(f, 8, 196, 120), ties: [[200 + w + 2, 122]] };
    } },
    curly:  { label: "くせ毛", make: function (f) {
      var w = f.w, ry = SY - f.top, s = capTop(f, 10) + hairline(f, 10, 205, 124), i;
      for (i = 0; i <= 10; i++) {
        var a = Math.PI - Math.PI * i / 10;
        s += circ(+(200 + (w + 8) * Math.cos(a)).toFixed(1), +(SY + 10 - (ry + 10) * Math.sin(a)).toFixed(1), 24);
      }
      for (i = 0; i < 5; i++) s += circ(200 - w * 0.56 + w * 0.28 * i, 126, 15);
      return { front: s };
    } },
    mohawk: { label: "モヒカン", make: function (f) {
      var cy = f.top + 74, n = 7, s = "M182 " + (f.top + 40), i;
      for (i = 0; i <= 2 * n; i++) {
        var a = (-46 + 92 * i / (2 * n)) * Math.PI / 180, r = i % 2 ? 76 : 108;
        s += "L" + (200 + r * Math.sin(a)).toFixed(1) + " " + (cy - r * Math.cos(a)).toFixed(1);
      }
      return { front: capTop(f, 1) + hairline(f, 1, 188, 118), soft: true, extra: s + "L218 " + (f.top + 40) + "Q200 " + (f.top + 52) + " 182 " + (f.top + 40) + "Z" };
    } }
  };

  var BROWS = {
    natural: { label: "ふつう", d: "M-17 4Q-2 -7 17 -1", sw: 5.5 },
    thick:   { label: "太め",   d: "M-18 4Q-2 -8 18 0", sw: 9 },
    thin:    { label: "細め",   d: "M-16 3Q-2 -7 16 -1", sw: 3.5 },
    straight:{ label: "まっすぐ", d: "M-17 1L17 0", sw: 6 },
    angry:   { label: "キリッ", d: "M-17 -5L17 6", sw: 6.5 },
    worried: { label: "こまり", d: "M-17 4Q0 3 16 -7", sw: 5.5 }
  };

  var EYES = {
    normal:  { label: "ふつう" },
    big:     { label: "キラキラ" },
    lashes:  { label: "まつげ" },
    sleepy:  { label: "ねむい" },
    smile:   { label: "にっこり" },
    wink:    { label: "ウインク" },
    surprise:{ label: "びっくり" },
    line:    { label: "ほそ目" }
  };

  var NOSES = { small: { label: "小さめ" }, round: { label: "まるい" }, tall: { label: "高め" }, wide: { label: "ひろめ" }, dot: { label: "ちょん" } };

  var MOUTHS = {
    smile: { label: "スマイル" }, closed: { label: "にこ" }, grin: { label: "歯を見せる" }, laugh: { label: "大わらい" }, neutral: { label: "ふつう" },
    o: { label: "おっ" }, tongue: { label: "べー" }, smirk: { label: "ニヤリ" }, cat: { label: "ω" }
  };

      cv.toBlob(function (b) { if (b) download(b, fileName("png")); else toast("画像を作れませんでした"); }, "image/png");
    };
    img.onerror = function () { toast("画像を作れませんでした"); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  };

  window.ELDIA_AVATAR = { render: renderAvatar, DEFAULT: DEFAULT };

  renderTabs();
  renderAll();
})();
</script>
</body>
</html>
