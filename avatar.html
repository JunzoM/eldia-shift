<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>アバターメーカー — HOTEL ELDIA</title>
<style>
:root{
  --font:'BIZ UDPGothic','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif;
  --bg:#E1E6EC; --surf:#FFFFFF; --surf2:#F6F8FA;
  --line:#D3DAE2; --line-soft:#E6EAEF;
  --ink:#1B2631; --ink-2:#3D4A57; --muted:#667382;
  --pri:#1F5E8A; --pri-hover:#184C70; --pri-soft:#E3EEF6; --danger:#C23B2A;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
button,input{font-family:inherit}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar h1{font-size:16px;margin:0;font-weight:700}
.bar a{margin-left:auto;font-size:13px;color:var(--pri);text-decoration:none;font-weight:700}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:64px}
.preview{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--surf2);border:1px solid var(--line-soft);touch-action:none}

.name{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surf2);text-align:center}
.name:focus{outline:none;border-color:var(--pri)}
.row{display:flex;gap:8px}
.row > *{flex:1}
.btn{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surf2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hover)}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin:0 0 8px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.g-item{position:relative;cursor:pointer;text-align:center;font-size:11px;color:var(--ink-2)}
.g-item .thumb{border-radius:50%;overflow:hidden;border:2px solid transparent;aspect-ratio:1;background:var(--surf2)}
.g-item.on .thumb{border-color:var(--pri)}

.g-item .nm{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-item .del{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--danger);font-size:12px;line-height:1;cursor:pointer;display:none}
.g-item:hover .del{display:block}
.empty{grid-column:1/-1;font-size:12px;color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--pri)}
.sw.none{background:repeating-linear-gradient(45deg,#fff 0 5px,#e5e8ec 5px 10px)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.opt{border:2px solid var(--line-soft);border-radius:12px;background:var(--surf2);cursor:pointer;padding:0;overflow:hidden;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--line)}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}

.opt .lb{font-size:12px;font-weight:700;color:var(--ink-2);padding:4px 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.opt img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.g-item .thumb img{display:block;width:100%;height:100%;object-fit:cover}
.hint{margin:0;font-size:11px;color:var(--muted);text-align:center}
.nogl{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;font-size:13px;color:var(--muted);line-height:1.7}
.preview{cursor:grab}
.preview:active{cursor:grabbing}

@media (max-width:760px){
  .layout{grid-template-columns:1fr;padding:12px}
  .stage{position:static}
  .preview{width:min(260px,70vw);margin:0 auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
}
</style>
</head>
<body>
<header class="bar">
  <h1>アバターメーカー</h1>
  <a href="/">← シフト表へ</a>
</header>
<main class="layout">
  <section class="stage">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="preview live" id="preview"></div>
      <input class="name" id="name" placeholder="名前（例：山田）" maxlength="20">
      <div class="row">
        <button class="btn" id="undo" title="元に戻す">↶ 戻す</button>
        <button class="btn" id="redo" title="やり直す">↷ 進む</button>
        <button class="btn" id="random">🎲 おまかせ</button>
      </div>
      <div class="row">
        <button class="btn pri" id="save">保存</button>
        <button class="btn" id="new">新規</button>
      </div>
      <div class="row">
        <button class="btn" id="png">画像を保存(PNG)</button>
        <button class="btn" id="front">正面に戻す</button>
      </div>
      <p class="hint">ドラッグで回転・ダブルクリックで正面。顔はマウスや指の方を向きます。</p>
    </div>
    <div class="card">
      <p class="sec-title">保存したアバター</p>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>
  <section class="editor">
    <nav class="tabs" id="tabs"></nav>
    <div class="card" id="panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="swatches" id="colors"></div>
      <div class="toggles" id="toggles"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="vendor/three.min.js"></script>
<script src="avatar3d.js"></script>

<script>
(function () {
  "use strict";

  // ---------- 色ユーティリティ ----------
  function hexToRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function rgbToHex(c) { return "#" + c.map(function (v) { return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0"); }).join(""); }
  // amt > 0 で明るく、< 0 で暗く
  function shade(hex, amt) {
    var c = hexToRgb(hex), t = amt > 0 ? 255 : 0, p = Math.abs(amt);
    return rgbToHex(c.map(function (v) { return v + (t - v) * p; }));
  }

  // ---------- パーツ定義 ----------
  var SKINS = ["#FFE6D2", "#F6CBA6", "#EDBA92", "#E0A67C", "#C98C5E", "#A86D45", "#7D4B2C", "#57331F", "#BFE3F7", "#D9C8F5"];
  var HAIR_COLORS = ["#1C1714", "#3B2A20", "#6B4A2F", "#A0703F", "#D9B26A", "#ECDDB4", "#A63A22", "#8E8E8E", "#F2F2F2", "#E8669F", "#4A7BD8", "#7A4FD0", "#3FA37A"];
  var EYE_COLORS = ["#3B2618", "#6B4423", "#8A6A2B", "#2F6FA8", "#3C8A5A", "#6F7782", "#8E3FA6"];
  var LIP_COLORS = ["#C9535E", "#B5524A", "#E07A8C", "#C2253A", "#9C3D5E", "#8A5240"];
  var GLASSES_COLORS = ["#222222", "#7A4B2A", "#C9A227", "#C23B2A", "#1F5E8A", "#E8669F", "#BBBBBB"];
  var HAT_COLORS = ["#1F5E8A", "#C23B2A", "#2D7A52", "#F2B233", "#222222", "#F2F2F2", "#E8669F", "#7A4FD0"];
  var CLOTHES_COLORS = ["#1F5E8A", "#2B3440", "#F2F2F2", "#C23B2A", "#2D7A52", "#F2B233", "#E8669F", "#7A4FD0", "#8A6A4B", "#4FB0C6"];
  var BG_COLORS = ["#CFE3F2", "#FAD9DF", "#FBE8B8", "#D4EDD9", "#E2D9F5", "#F5E0CC", "#DDE2E8", "#2B3440", "transparent"];

  var FACES = { round: { label: "まる" }, oval: { label: "たまご" }, square: { label: "しかく" }, heart: { label: "シャープ" }, wide: { label: "ふっくら" } };
  var HAIRS = {
    none: { label: "なし" }, buzz: { label: "ぼうず" }, short: { label: "ショート" }, side: { label: "サイド分け" }, spiky: { label: "ツンツン" },
    bangs: { label: "ぱっつん" }, long: { label: "ロング" }, bun: { label: "おだんご" }, twin: { label: "ツイン" }, pony: { label: "ポニー" },
    curly: { label: "くせ毛" }, mohawk: { label: "モヒカン" }
  };

  var BROWS = {
    natural: { label: "ふつう" }, thick: { label: "太め" }, thin: { label: "細め" },
    straight: { label: "まっすぐ" }, angry: { label: "キリッ" }, worried: { label: "こまり" }
  };

  var EYES = {
    normal:  { label: "ふつう" },
    big:     { label: "キラキラ" },
    lashes:  { label: "まつげ" },
    sleepy:  { label: "ねむい" },
    smile:   { label: "にっこり" },
    wink:    { label: "ウインク" },
    surprise:{ label: "びっくり" },
    line:    { label: "ほそ目" }
  };

  var NOSES = { small: { label: "小さめ" }, round: { label: "まるい" }, tall: { label: "高め" }, wide: { label: "ひろめ" }, dot: { label: "ちょん" } };

  var MOUTHS = {
    smile: { label: "スマイル" }, closed: { label: "にこ" }, grin: { label: "歯を見せる" }, laugh: { label: "大わらい" }, neutral: { label: "ふつう" },
    o: { label: "おっ" }, tongue: { label: "べー" }, smirk: { label: "ニヤリ" }, cat: { label: "ω" }
  };

  var BEARDS = { none: { label: "なし" }, stubble: { label: "ぶしょう" }, mustache: { label: "口ひげ" }, goatee: { label: "あごひげ" }, full: { label: "フル" } };
  var GLASSES = { none: { label: "なし" }, round: { label: "まる" }, square: { label: "しかく" }, half: { label: "ハーフ" }, sun: { label: "サングラス" } };
  var HATS = { none: { label: "なし" }, cap: { label: "キャップ" }, beanie: { label: "ニット帽" }, hat: { label: "ハット" }, ribbon: { label: "リボン" }, crown: { label: "王冠" }, phones: { label: "ヘッドホン" } };
  var EARRINGS = { none: { label: "なし" }, stud: { label: "スタッド" }, hoop: { label: "フープ" }, pearl: { label: "パール" } };
  var CLOTHES = { tee: { label: "Tシャツ" }, vneck: { label: "Vネック" }, hoodie: { label: "パーカー" }, shirt: { label: "シャツ" }, turtle: { label: "タートル" }, suit: { label: "スーツ" } };

  var DEFAULT = {
    face: "round", skin: "#F6CBA6", blush: true, freckles: false,
    hair: "side", hairColor: "#4A3122", brows: "natural",
    eyes: "normal", eyeColor: "#5A3A22", nose: "small",
    mouth: "smile", lip: "#C9535E", beard: "none",
    glasses: "none", glassesColor: "#222222", hat: "none", hatColor: "#1F5E8A",
    earrings: "none", clothes: "tee", clothesColor: "#1F5E8A", bg: "#CFE3F2"
  };

  // ---------- カテゴリ（タブ） ----------
  var CATS = [
    { key: "face",     label: "輪郭・肌", opts: FACES,    color: ["skin", SKINS], toggles: [["blush", "チーク"], ["freckles", "そばかす"]] },
    { key: "hair",     label: "髪型",     opts: HAIRS,    color: ["hairColor", HAIR_COLORS] },
    { key: "brows",    label: "まゆ",     opts: BROWS,    color: ["hairColor", HAIR_COLORS] },
    { key: "eyes",     label: "目",       opts: EYES,     color: ["eyeColor", EYE_COLORS] },
    { key: "nose",     label: "鼻",       opts: NOSES },
    { key: "mouth",    label: "口",       opts: MOUTHS,   color: ["lip", LIP_COLORS] },
    { key: "beard",    label: "ひげ",     opts: BEARDS,   color: ["hairColor", HAIR_COLORS] },
    { key: "glasses",  label: "メガネ",   opts: GLASSES,  color: ["glassesColor", GLASSES_COLORS] },
    { key: "hat",      label: "帽子",     opts: HATS,     color: ["hatColor", HAT_COLORS] },
    { key: "earrings", label: "ピアス",   opts: EARRINGS },
    { key: "clothes",  label: "服",       opts: CLOTHES,  color: ["clothesColor", CLOTHES_COLORS] },
    { key: "bg",       label: "背景",     color: ["bg", BG_COLORS] }
  ];

  // ---------- 状態・履歴・保存 ----------
  var STORE = "eldia_avatars";
  var state = Object.assign({}, DEFAULT);
  var past = [], future = [];
  var currentId = null;
  var cat = "face";

  function loadGallery() { try { var v = JSON.parse(localStorage.getItem(STORE) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function saveGallery(list) { try { localStorage.setItem(STORE, JSON.stringify(list)); return true; } catch (e) { return false; } }

  function set(patch) {
    past.push(state);
    if (past.length > 60) past.shift();
    future = [];
    state = Object.assign({}, state, patch);
    renderAll();
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function chance(p, yes, no) { return Math.random() < p ? yes : no; }
  function randomState() {
    return {
      face: pick(Object.keys(FACES)), skin: pick(SKINS.slice(0, 8)), blush: Math.random() < 0.6, freckles: Math.random() < 0.15,
      hair: pick(Object.keys(HAIRS).filter(function (k) { return k !== "none"; })), hairColor: pick(HAIR_COLORS),
      brows: pick(Object.keys(BROWS)), eyes: pick(Object.keys(EYES)), eyeColor: pick(EYE_COLORS),
      nose: pick(Object.keys(NOSES)), mouth: pick(Object.keys(MOUTHS)), lip: pick(LIP_COLORS),
      beard: chance(0.25, pick(["stubble", "mustache", "goatee", "full"]), "none"),
      glasses: chance(0.3, pick(["round", "square", "half", "sun"]), "none"), glassesColor: pick(GLASSES_COLORS),
      hat: chance(0.2, pick(Object.keys(HATS).filter(function (k) { return k !== "none"; })), "none"), hatColor: pick(HAT_COLORS),
      earrings: chance(0.25, pick(["stud", "hoop", "pearl"]), "none"),
      clothes: pick(Object.keys(CLOTHES)), clothesColor: pick(CLOTHES_COLORS), bg: pick(BG_COLORS.slice(0, 7))
    };
  }

  // ---------- 画面 ----------
  var $ = function (id) { return document.getElementById(id); };
  var preview = $("preview");
  var stage3d = null;

  // サムネイルは1枚ずつ順番に撮影（画面が固まらないように）
  var thumbCache = {}, thumbCount = 0, queue = [], pumping = false;
  function thumb(img, st, view, bg) {
    var key = view + "|" + bg + "|" + JSON.stringify(st);
    if (thumbCache[key]) { img.src = thumbCache[key]; return; }
    queue.push({ img: img, st: st, view: view, bg: bg, key: key });
    if (!pumping) { pumping = true; requestAnimationFrame(pump); }
  }
  function pump() {
    var job;
    while ((job = queue.shift()) && !job.img.isConnected) {}
    if (!job) { pumping = false; return; }
    if (!thumbCache[job.key]) {
      if (++thumbCount > 400) { thumbCache = {}; thumbCount = 0; }
      thumbCache[job.key] = Avatar3D.snapshot(job.st, job.view, 192, job.bg);
    }
    job.img.src = thumbCache[job.key];
    requestAnimationFrame(pump);
  }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function renderTabs() {
    var el = $("tabs"); el.innerHTML = "";
    CATS.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "tab" + (c.key === cat ? " on" : "");
      b.textContent = c.label;
      b.onclick = function () { cat = c.key; renderTabs(); renderPanel(); };
      el.appendChild(b);
    });
  }

  function renderPanel() {
    var c = CATS.filter(function (x) { return x.key === cat; })[0];
    var colors = $("colors"), toggles = $("toggles"), grid = $("grid");
    colors.innerHTML = ""; toggles.innerHTML = ""; grid.innerHTML = "";
    colors.style.display = c.color ? "" : "none";
    toggles.style.display = c.toggles ? "" : "none";
    grid.style.display = c.opts ? "" : "none";

    if (c.color) c.color[1].forEach(function (hex) {
      var b = document.createElement("button");
      b.className = "sw" + (hex === "transparent" ? " none" : "") + (state[c.color[0]] === hex ? " on" : "");
      if (hex !== "transparent") b.style.background = hex;
      b.title = hex === "transparent" ? "なし（透明）" : hex;
      b.onclick = function () { var p = {}; p[c.color[0]] = hex; set(p); };
      colors.appendChild(b);
    });
    if (c.toggles) c.toggles.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "chip" + (state[t[0]] ? " on" : "");
      b.textContent = (state[t[0]] ? "✓ " : "") + t[1];
      b.onclick = function () { var p = {}; p[t[0]] = !state[t[0]]; set(p); };
      toggles.appendChild(b);
    });
    if (c.opts) Object.keys(c.opts).forEach(function (k) {
      var b = document.createElement("button");
      var variant = Object.assign({}, state);
      variant[c.key] = k;
      b.className = "opt" + (state[c.key] === k ? " on" : "");
      b.innerHTML = '<img alt=""><div class="lb"></div>';
      b.querySelector(".lb").textContent = c.opts[k].label;
      if (stage3d) thumb(b.querySelector("img"), variant, c.key, "transparent");
      b.onclick = function () { var p = {}; p[c.key] = k; set(p); };
      grid.appendChild(b);
    });
  }

  function renderGalleryUI() {
    var el = $("gallery"), list = loadGallery();
    el.innerHTML = "";
    if (!list.length) { el.innerHTML = '<div class="empty">まだありません。「保存」で追加できます。</div>'; return; }
    list.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "g-item" + (it.id === currentId ? " on" : "");
      d.innerHTML = '<div class="thumb"><img alt=""></div><div class="nm"></div><button class="del" title="削除">×</button>';
      if (stage3d) thumb(d.querySelector("img"), Object.assign({}, DEFAULT, it.state), "main");
      d.querySelector(".nm").textContent = it.name || "（名前なし）";
      d.onclick = function () {
        past.push(state); future = [];
        state = Object.assign({}, DEFAULT, it.state);
        currentId = it.id; $("name").value = it.name || "";
        renderAll();
      };
      d.querySelector(".del").onclick = function (e) {
        e.stopPropagation();
        if (!confirm("「" + (it.name || "名前なし") + "」を削除しますか？")) return;
        saveGallery(loadGallery().filter(function (x) { return x.id !== it.id; }));
        if (currentId === it.id) currentId = null;
        renderGalleryUI();
      };
      el.appendChild(d);
    });
  }

  function renderAll() {
    if (stage3d) stage3d.set(Object.assign({}, DEFAULT, state));
    $("undo").disabled = !past.length;
    $("redo").disabled = !future.length;
    renderPanel();
    renderGalleryUI();
  }

  // ---------- ボタン ----------
  $("undo").onclick = function () { if (!past.length) return; future.push(state); state = past.pop(); renderAll(); };
  $("redo").onclick = function () { if (!future.length) return; past.push(state); state = future.pop(); renderAll(); };
  $("random").onclick = function () { set(randomState()); };
  $("new").onclick = function () {
    past.push(state); future = [];
    state = Object.assign({}, DEFAULT); currentId = null; $("name").value = "";
    renderAll();
  };
  $("save").onclick = function () {
    var name = $("name").value.trim(), list = loadGallery(), now = new Date().toISOString();
    var it = currentId && list.filter(function (x) { return x.id === currentId; })[0];
    if (it) { it.name = name; it.state = Object.assign({}, state); it.updated = now; }
    else {
      currentId = "a" + Date.now().toString(36);
      list.unshift({ id: currentId, name: name, state: Object.assign({}, state), updated: now });
    }
    if (saveGallery(list)) toast("保存しました"); else toast("保存できませんでした");
    renderGalleryUI();
  };

  function fileName(ext) { return ($("name").value.trim() || "avatar").replace(/[\\/:*?"<>|]/g, "_") + "." + ext; }
  $("front").onclick = function () { if (stage3d) stage3d.resetView(); };
  $("png").onclick = function () {
    if (!stage3d) return;
    var url = Avatar3D.snapshot(Object.assign({}, DEFAULT, state), "main", 1024);
    fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fileName("png");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }).catch(function () { toast("画像を作れませんでした"); });
  };

  if (window.Avatar3D && Avatar3D.supported()) {
    stage3d = Avatar3D.mount(preview);
  } else {
    preview.innerHTML = '<div class="nogl">この端末・ブラウザでは 3D 表示ができません。<br>Chrome / Edge / Safari の最新版で開いてください。</div>';
  }
  renderTabs();
  renderAll();
})();
</script>
</body>
</html>
