                        if(from===null&&wBest!==null) continue;
                        if(from!==null&&wBest===null){wPat=p;wBest=from;continue;}
                        if(from>wBest){wPat=p;wBest=from;}
                      }
                      if(!wPat&&s.activePatternId) wPat=(s.patterns||[]).find(p=>p.id===s.activePatternId)||wPat;
                      let wDays=0,wHours=0;
                      if(wPat){for(let d=0;d<7;d++){
                        const bid=wPat.days[d];if(!bid)continue;
                        const b=findBlock(bid,s.timeBlocks,globalTemplates);
                        if(!b||b.inH==null)continue;
                        const nh=calcNetH(b.inH,b.inM||0,b.outH,b.outM||0);
                        if(nh>0){wDays++;wHours+=nh;}
                      }}
                      const pl=calcPaidLeaveGrant(s.joinDate,wDays||null,wHours||null);
                      if(!pl) return null;
                      // 今期付与開始日を算出（最後に付与が発生した月数しきい値の日）
                      const join=new Date(s.joinDate);
                      const today=new Date();
                      let mons=(today.getFullYear()-join.getFullYear())*12+(today.getMonth()-join.getMonth());
                      if(today.getDate()<join.getDate()) mons--;
                      const gm=[6,18,30,42,54,66,78];
                      let done=0;for(const m of gm){if(mons>=m)done++;}
                      const threshMons=done>=1?gm[done-1]:6;
                      const fromDate=new Date(join);
                      fromDate.setMonth(fromDate.getMonth()+threshMons);
                      const fromStr=ymd(fromDate);
                      // 選択月の末日までを集計範囲とする
                      const lastDay=getDays(year,month-1);
                      const toStr=`${year}-${String(month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
                      // cellDataからoff2の付与期間内累積使用数を集計
                      const prefix=`${s.id}|`;
                      let totalUsed=0;
                      for(const [k,v] of Object.entries(cellData)){
                        if(!k.startsWith(prefix)) continue;
                        const dateStr=k.slice(prefix.length);
                        if(dateStr<fromStr||dateStr>toStr) continue;
                        if(v&&v.blockId==='off2') totalUsed++;
                      }
                      const sal=salary.find(x=>x.id===s.id);
                      const paidDays=sal?.paidDays||0;
                      return {pl,paidDays,totalUsed,remaining:Math.max(0,pl.total-totalUsed)};
                    })();
                    return(
                      <tr key={s.id} style={{background:"#fff"}}>
                        <td style={{padding:"8px 12px",borderBottom:"1px solid #e2e8f0",fontWeight:600}}>
                          <span style={{color:"#94a3b8",fontSize:10,marginRight:6}}>{s.no}</span>{s.name}
                        </td>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #e2e8f0",textAlign:"center"}}>
                          <span style={{color:"var(--ink)",fontFamily:"var(--num)",fontWeight:700,fontSize:15,fontVariantNumeric:"tabular-nums"}}>{sm.workDays}<span style={{fontSize:12,fontWeight:400,marginLeft:2}}>日</span></span>
                        </td>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #e2e8f0",textAlign:"center"}}>
                          <span style={{color:"var(--ink)",fontFamily:"var(--num)",fontWeight:700,fontSize:15,fontVariantNumeric:"tabular-nums"}}>{sm.totalH}<span style={{fontSize:12,fontWeight:400,marginLeft:2}}>時間</span></span>
                        </td>
                        <td style={{padding:"6px 10px",borderBottom:"1px solid #e2e8f0",textAlign:"center"}}>
                          {!s.joinDate?(
                            <span style={{color:"#d1d5db",fontSize:11}}>—</span>
                          ):!plData?(
                            <span style={{fontSize:10.5,color:"#94a3b8"}}>未付与<br/><span style={{fontSize:9}}>（入社6ヶ月未満）</span></span>
                          ):(
                            <div style={{lineHeight:1.5}}>
                              <div style={{fontFamily:"var(--num)",fontWeight:700,color:"#0f766e",fontSize:14}}>残{plData.remaining}日</div>
                              <div style={{fontSize:9.5,color:"#64748b"}}>付与{plData.pl.total}日 / 使用済{plData.totalUsed}日</div>
                              {plData.paidDays>0&&<div style={{fontSize:9.5,color:"#0f766e",fontWeight:700}}>今月{plData.paidDays}日</div>}
                              {plData.pl.isHirei&&<div style={{fontSize:8.5,color:"#2563eb"}}>比例付与・週{plData.pl.weeklyDays}日</div>}
                            </div>
                          )}
                        </td>
                        <td style={{padding:"8px 10px",borderBottom:"1px solid #e2e8f0"}}>
                          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                            {s.timeBlocks.map(b=>{const c=PALETTE[b.colorIdx];return(
                              <span key={b.id} style={{background:c.bg,color:c.color,border:`1px solid ${c.color}`,padding:"1px 7px",borderRadius:5,fontSize:10,fontWeight:700}}>
                                {b.short} {b.inH!=null?`${fmtT(b.inH,b.inM)}-${fmtT(b.outH,b.outM)}`:""}
                              </span>
                            );})}
                            {s.timeBlocks.length===0&&<span style={{fontSize:10.5,color:"#e2e8f0"}}>—</span>}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );
        })}
        </>}

        {/* ── SETTINGS ── */}
        {view==="settings"&&<>
          <div className="sub-tabs">
            <button className={`sub-tab${settingsTab==="staff"?" on":""}`} onClick={()=>setSettingsTab("staff")}>👤 スタッフ</button>
            <button className={`sub-tab${settingsTab==="global"?" on":""}`} onClick={()=>setSettingsTab("global")}>🌐 共通テンプレート</button>
          </div>

          {/* ── Staff settings ── */}
          {settingsTab==="staff"&&<>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
              <span style={{fontSize:13,color:"#64748b"}}>スタッフを選んで個人設定・週間パターンを管理</span>
              <input
                className="inp"
                placeholder="🔍 名前で検索..."
                value={staffSearch}
                onChange={e=>{setStaffSearch(e.target.value);setOpenStaffId(null);}}
                style={{width:160,fontSize:12,padding:"4px 10px"}}
              />
              <button className="btn gold sm" style={{marginLeft:"auto"}} onClick={()=>setAddingStaff(v=>!v)}>＋ スタッフ追加</button>
            </div>
            <div className="form-row" style={{marginTop:0,marginBottom:14,borderStyle:"solid"}}>
              <span style={{fontSize:13,fontWeight:700}}>部署の一括移動</span>
              <select value={moveFrom} onChange={e=>setMoveFrom(e.target.value)} style={{...SEL,fontSize:13,padding:"5px 10px"}}>
                {depts.map(d=><option key={d.id} value={d.id}>{d.label}（{staff.filter(s=>s.deptId===d.id&&s.active).length}人）</option>)}
              </select>
              <span style={{fontSize:13}}>の全員を</span>
              <select value={moveTo} onChange={e=>setMoveTo(e.target.value)} style={{...SEL,fontSize:13,padding:"5px 10px"}}>
                {depts.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
              </select>
              <span style={{fontSize:13}}>へ</span>
              <button className="btn sm" disabled={moveFrom===moveTo} onClick={moveDeptAll}>移動する</button>
              <span style={{fontSize:12,color:"var(--muted)"}}>1人ずつ変えるときは、各スタッフを開いて「部署」を変更</span>
            </div>
            {addingStaff&&(
              <div className="form-row" style={{marginBottom:14}}>
                <input className="inp" placeholder="氏名 *" value={newStaff.name} onChange={e=>setNewStaff(p=>({...p,name:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addStaff()} autoFocus style={{width:130}}/>
                <select value={newStaff.deptId} onChange={e=>setNewStaff(p=>({...p,deptId:e.target.value}))} style={{...SEL,fontSize:13,padding:"5px 10px"}}>{depts.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}</select>
                <button className="btn gold" onClick={addStaff}>追加</button>
                <button className="btn sec" onClick={()=>setAddingStaff(false)}>キャンセル</button>
              </div>
            )}
            {staffByDept.map(dept=>{
              const deptMembers=[...staff.filter(s=>s.deptId===dept.id)].sort((a,b)=>a.no-b.no)
                .filter(s=>!staffSearch||s.name.includes(staffSearch));
              if(deptMembers.length===0)return null;
              const dc=PALETTE[dept.colorIdx];
              return(
                <div key={dept.id} style={{marginBottom:18}}>
                  <span style={{fontSize:13,fontWeight:700,color:dc.color,background:dc.bg,padding:"3px 12px",borderRadius:8,border:`1px solid ${dc.color}`,display:"inline-block",marginBottom:8}}>{dept.label}</span>
                  {staffSearch&&<span style={{fontSize:11,color:"#94a3b8",marginLeft:8}}>{deptMembers.length}件</span>}
                  {deptMembers.map(s=>{
                    const isOpen=openStaffId===s.id;
                    return(
                      <div key={s.id} className="staff-card"
                        draggable
                        onDragStart={()=>{dragStaffId.current=s.id;}}
                        onDragOver={e=>{e.preventDefault();setDragOverId(s.id);}}
                        onDragLeave={()=>setDragOverId(null)}
                        onDrop={()=>handleDrop(s.id)}
                        style={{opacity:dragStaffId.current===s.id?.4:1,
                          outline:dragOverId===s.id?"2px dashed var(--pri)":"none",
                          outlineOffset:2,transition:"outline .1s"}}>
                        <div className={`staff-card-hdr${isOpen?" open":""}`} onClick={()=>setOpenStaffId(isOpen?null:s.id)}>
                          <span style={{fontSize:10,color:"#94a3b8",minWidth:16}}>{s.no}</span>
                          <span style={{fontSize:14,fontWeight:700,textDecoration:!s.active?"line-through":"none"}}>{s.name}</span>
                          {!s.active&&<span style={{fontSize:9,color:"#ef4444",background:"#fee2e2",padding:"1px 5px",borderRadius:3}}>退職</span>}
                          {/* Block count */}
                          {s.timeBlocks.length>0&&<span style={{fontSize:11,color:"#0f766e",background:"#ccfbf1",padding:"1px 6px",borderRadius:5}}>⏱ {s.timeBlocks.length}個人</span>}
                          {/* Pattern count */}
                          {s.patterns.length>0&&<span style={{fontSize:11,color:"#6d28d9",background:"#ede9fe",padding:"1px 6px",borderRadius:5}}>📅 {s.patterns.length}パターン</span>}
                          {/* 並び替えボタン */}
                          <div style={{marginLeft:"auto",display:"flex",gap:3,alignItems:"center"}} onClick={e=>e.stopPropagation()}>
                            <span style={{fontSize:14,color:"#cbd5e1",cursor:"grab",padding:"0 4px",userSelect:"none"}} title="ドラッグで並び替え">⠿</span>
                            <button onClick={()=>moveStaff(s.id,-1)} style={{background:"#e8ecf5",border:"none",borderRadius:4,width:22,height:22,cursor:"pointer",fontSize:12,color:"#475569",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↑</button>
                            <button onClick={()=>moveStaff(s.id,1)} style={{background:"#e8ecf5",border:"none",borderRadius:4,width:22,height:22,cursor:"pointer",fontSize:12,color:"#475569",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↓</button>
                            <span style={{fontSize:11,opacity:.4,marginLeft:4}}>{isOpen?"▲":"▼"}</span>
                          </div>
                        </div>
                        {isOpen&&(
                          <div>
                            {/* Meta */}
                            <div style={{padding:"10px 16px",background:"var(--surf2)",borderBottom:"1px solid #e2e8f0",display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                              <div style={{display:"flex",flexDirection:"column",gap:3}}>
                                <label style={{fontSize:10.5,color:"#64748b",fontWeight:600}}>名前</label>
                                <input value={s.name} onChange={e=>updateStaff(s.id,p=>({...p,name:e.target.value}))}
                                  style={{border:"1.5px solid var(--line)",borderRadius:6,padding:"5px 10px",fontSize:13,outline:"none",background:"#fff",fontFamily:"var(--font)",width:130}}/>
                              </div>
                              <div style={{display:"flex",flexDirection:"column",gap:3}}>
                                <label style={{fontSize:10.5,color:"#64748b",fontWeight:600}}>部署</label>
                                <select value={s.deptId} onChange={e=>updateStaff(s.id,p=>({...p,deptId:e.target.value}))}
                                  style={{...SEL,fontSize:13,padding:"5px 10px"}}>
                                  {depts.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
                                </select>
                              </div>
                              <div style={{display:"flex",flexDirection:"column",gap:3}}>
                                <label style={{fontSize:10.5,color:"#64748b",fontWeight:600}}>入社日</label>
                                <input type="text" value={s.joinDate||""} onChange={e=>updateStaff(s.id,p=>({...p,joinDate:e.target.value}))}
                                  onBlur={e=>{const v=normalizeDate(e.target.value);updateStaff(s.id,p=>({...p,joinDate:v}));}}
                                  placeholder="YYYY-MM-DD"
                                  style={{...SEL,padding:"4px 8px",fontSize:12,width:110}}/>
                              </div>
                              <div style={{display:"flex",flexDirection:"column",gap:3}}>
                                <label style={{fontSize:10.5,color:"#64748b",fontWeight:600}}>退職日</label>
                                <input type="text" value={s.leaveDate||""} onChange={e=>updateStaff(s.id,p=>({...p,leaveDate:e.target.value,active:!e.target.value}))}
                                  onBlur={e=>{const v=normalizeDate(e.target.value);updateStaff(s.id,p=>({...p,leaveDate:v,active:!v}));}}
                                  placeholder="YYYY-MM-DD"
                                  style={{...SEL,padding:"4px 8px",fontSize:12,width:110}}/>
                              </div>
                              <div style={{display:"flex",flexDirection:"column",gap:3}}>
                                <label style={{fontSize:10.5,color:"#64748b",fontWeight:600}}>在職</label>
                                <label style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",fontSize:12}}>
                                  <input type="checkbox" checked={s.active} onChange={e=>updateStaff(s.id,p=>({...p,active:e.target.checked,leaveDate:e.target.checked?"":p.leaveDate}))} style={{cursor:"pointer"}}/>
                                  在職中
                                </label>
                              </div>
                              <button onClick={()=>{
                                setStaff(p=>{
                                  const filtered = p.filter(x=>x.id!==s.id);
                                  // 同じ部署のスタッフの番号を繰り上げ
                                  const deptId = s.deptId;
                                  let no = 1;
                                  return filtered.map(x=>{
                                    if(x.deptId===deptId){ return {...x, no:no++}; }
                                    return x;
                                  });
                                });
                              }} className="btn danger sm" style={{marginLeft:"auto",alignSelf:"flex-end"}}>削除</button>
                            </div>

                            {/* Section tabs */}
                            <div style={{padding:"10px 16px 0",background:"#fff"}}>
                              <div className="sec-tabs">
                                <button className={`sec-tab${staffSettingSection==="timeblocks"?" on":""}`}
                                  onClick={()=>setStaffSettingSection("timeblocks")}>
                                  ⏱ 個人時間テンプレート {s.timeBlocks.length>0&&<span style={{background:"rgba(255,255,255,.25)",borderRadius:10,padding:"0 5px",fontSize:10}}>{s.timeBlocks.length}</span>}
                                </button>
                                <button className={`sec-tab${staffSettingSection==="patterns"?" on":""}`}
                                  onClick={()=>setStaffSettingSection("patterns")}>
                                  📅 週間パターン {s.patterns.length>0&&<span style={{background:"rgba(255,255,255,.25)",borderRadius:10,padding:"0 5px",fontSize:10}}>{s.patterns.length}</span>}
                                </button>
                                <button className={`sec-tab${staffSettingSection==="periodpatterns"?" on":""}`}
                                  onClick={()=>setStaffSettingSection("periodpatterns")} style={{background:staffSettingSection==="periodpatterns"?"var(--pri)":undefined,color:staffSettingSection==="periodpatterns"?"#fff":undefined}}>
                                  🗓 期間限定パターン {(s.periodPatterns||[]).length>0&&<span style={{background:"rgba(255,255,255,.25)",borderRadius:10,padding:"0 5px",fontSize:10}}>{(s.periodPatterns||[]).length}</span>}
                                </button>
                              </div>
                            </div>

                            {staffSettingSection==="timeblocks"&&(
                              <StaffTimeBlockManager s={s} onUpdate={updateStaff}/>
                            )}
                            {staffSettingSection==="patterns"&&(
                              <StaffPatternPanel s={s} globalTemplates={globalTemplates} onUpdate={updateStaff}/>
                            )}
                            {staffSettingSection==="periodpatterns"&&(
                              <PeriodPatternPanel s={s} globalTemplates={globalTemplates} onUpdate={updateStaff}/>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </>}

          {/* ── Global templates ── */}
          {settingsTab==="global"&&(
            <div>
              <GlobalTemplateManager globalTemplates={globalTemplates} setGlobalTemplates={setGlobalTemplates}/>
            </div>
          )}
        </>}
      </div>

      {showPrint&&<PrintModal onClose={()=>setShowPrint(false)} year={year} month={month} monthDates={monthDates} weekDates={weekDates} weekLabel={weekLabel} viewMode={viewMode} staffByDept={staffByDept} summary={summary} globalTemplates={globalTemplates} getEffective={getEffective} findBlock={findBlock}/>}
    </div>
  );
}

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ShiftApp />);
  </script>
</body>
</html>
